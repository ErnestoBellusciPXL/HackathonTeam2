name: CI
on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: openinzichten-frontend-ci
  cancel-in-progress: false

