  build:
    runs-on: self-hosted
    # needs: sonarqube
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        run: npm ci

        # Required for Sonar-CLI
        # Official action/docker doesnt run on ARM cpu
      #- name: Set up Java
      #  uses: actions/setup-java@v4
      #  with:
      #    distribution: temurin
      #    java-version: '21'

      #- name: Download SonarScanner CLI
      #  run: |
      #    SCANNER_VERSION=7.3.0.5189
      #    ZIP="sonar-scanner-cli-${SCANNER_VERSION}-linux-aarch64.zip"
      #    wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/$ZIP
