name: Deploy test environment frontend
on:
  workflow_run:
    workflows:
      - CI 
    types:
      - completed
  
  workflow_dispatch:


jobs:
  build:
    runs-on: self-hosted
    env:
      FRONTEND_PORT: '80'
      ENV: 'test'
      REPLICAS: '1'
      IMAGE_NAME: ${{ vars.DOCKER_IMAGE }}
      BACKEND_HOST: 'backend:8080'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          
      - name: Ensure proxy network exists
        run: |
          # Init swarm if not active (needed for overlay networks)
          docker info | grep -q "Swarm: active" || docker swarm init

          # Create global overlay+attachable 'proxy' network if missing
          if ! docker network inspect proxy >/dev/null 2>&1; then
            echo "Creating overlay network 'proxy'..."
            docker network create -d overlay --attachable proxy
          else
            echo "Network 'proxy' already exists, skipping creation."
          fi

      - name: Build and deploy frontend test environment
        working-directory: ./docker
        run: |
          docker compose -p $ENV -f docker-compose.yml down
          docker compose -p $ENV -f docker-compose.yml up -d
