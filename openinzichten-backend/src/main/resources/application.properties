spring.application.name=openinzichten
# Use MySQL running in Docker for development. Values match Docker/db-compose.dev.yml
# If you're running MySQL locally without Docker, adjust host/credentials accordingly.
jakarta.persistence.jdbc.url=jdbc:mysql://localhost:3306/app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=${jakarta.persistence.jdbc.url}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Credentials from Docker compose: MYSQL_USER / MYSQL_PASSWORD
spring.datasource.username=app_user
spring.datasource.password=dev_password
# Explicitly provide Hibernate dialect so it doesn't need JDBC metadata at startup
# Use Hibernate DDL auto=update for development; change in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
server.port=8080
# Base64-encoded JWT secret. For production set via environment variable or external config.
# Example (PowerShell):
#   $env:APP_JWT_SECRET = [Convert]::ToBase64String((New-Object Security.Cryptography.HMACSHA256).Key)
app.jwt.secret=${APP_JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
# --- Mail configuration (example) ---
# For real SMTP, set these in your environment or secrets store. Example using Gmail SMTP (not recommended for production):
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=no-reply@local.test
app.mail.from=no-reply@local.test
# Frontend URL used to build the reset link. The service will append the token to this value.
# Example for local frontend: http://localhost:3000/reset-password?token=
app.frontend.reset-url=http://localhost:5173/reset-password?token=

# Used for encrypting chat data
app.encryption.key=${APP_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

app.admin.login.email=${APP_ADMIN_EMAIL:admin@openinzicht.be}
app.admin.login.password=${APP_ADMIN_PASSWORD:0penInzicht?1PXL}
# OpenRouter AI configuration
# OpenRouter makes use of OpenAI-compatible endpoints and as such
# we can use the spring-ai OpenAI integration to connect to it.
# Note: NEVER EVER EVER COMMIT OR SHARE THE ACTUAL API KEY ANYWHERE PUBLICLY VISIBLE.
# THIS INCLUDES GITHUB EVEN THOUGH THE REPO IS PRIVATE. MAKE SURE TO LET C4B KNOW IF THE KEY EVER GETS EXPOSED.
spring.ai.openai.api-key=${OPENROUTER_KEY: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}
spring.ai.openai.base-url=https://openrouter.ai/api
# :nitro suffix automatically makes OpenRouter route to the provider with the best performance
spring.ai.openai.chat.options.model=openai/gpt-oss-120b:nitro
# Could probably be improved, but for now seems to work well enough...
#app.ai.system-prompt="Jij bent een behulpzame copywriter die teksten in het Vlaams schrijft, jouw taak is om de tekst dat een gebruiker heeft gestuurd te formatteren. Je mag geen extra informatie toevoegen aan de tekst of een titel zelf verzinnen, je mag wel tussenkopjes maken maar enkel als de tekst zelf zeer lang is, niet te veel tussenkoppen gebruiken en ook geen hoofdtitel verzinnen, maar zeker dus de tekst formatteren, liefst zo veel mogelijk dingen benadrukken met formattering die een belangrijke rol spelen in de tekst. Formatteren doe je met behulp van enkel en alleen HTML tags, GEEN markdown. De toegestane tags zijn: H1-H6, strong, em, u, en cite. Beantwoord enkel in het Vlaams, pas geen inhoud (spelfouten mogen wel) aan, beantwoord enkel met het verhaal, en formatteer de tekst."
app.ai.system-prompt-path=classpath:prompts/system.txt

# --- Actuator / Prometheus metrics ---
# Expose health, info and Prometheus metrics endpoints on the main server port
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
# --- OpenTelemetry Tracing ---
# Enable tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
# Export traces to Tempo via OTLP (use Docker service name)
management.otlp.tracing.endpoint=http://tempo:4318/v1/traces
#Prometheus fix
server.forward-headers-strategy=framework
management.server.use-forward-headers=true

