server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Docker Swarm Services Logs
  - job_name: docker_services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Assign Docker service name
      - source_labels: [ __meta_docker_service_name ]
        target_label: service
      # Assign Docker task name
      - source_labels: [ __meta_docker_task_name ]
        target_label: task
      # Assign container ID
      - source_labels: [ __meta_docker_container_id ]
        target_label: container_id
      # Assign Docker image name
      - source_labels: [ __meta_docker_image ]
        target_label: image
      # Assign environment label from Docker label
      - source_labels: [ __meta_docker_container_label_environment ]
        target_label: environment
      # Job label for Grafana
      - target_label: job
        replacement: docker_services
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - labels:
          stream:
          service:
          task:
          container_id:
          image:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output

  # Syslog
  - job_name: syslog
    static_configs:
      - targets: [ localhost ]
        labels:
          job: syslog
          __path__: /var/log/*.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output
